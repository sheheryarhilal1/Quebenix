{% extends 'base.html' %}{% block title %}Settings{% endblock %}{% block page %}Company settings{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">WORKSPACE CONFIGURATION</span><h1>Company settings</h1><p>Customize business details shown on invoices.</p></div></div><form class="panel form-panel settings-form" method="post"><h3>Business identity</h3><div class="form-row"><div><label>Company name</label><input name="company_name" value="{{ settings.company_name }}"></div><div><label>Business email</label><input name="email" type="email" value="{{ settings.email }}"></div></div><div class="form-row"><div><label>Phone</label><input name="phone" value="{{ settings.phone }}"></div><div><label>Currency code</label><select name="currency">{% for c in ['PKR','USD','GBP','AED','EUR'] %}<option {{ 'selected' if settings.currency==c }}>{{ c }}</option>{% endfor %}</select></div></div><label>Business address</label><textarea name="address" rows="2">{{ settings.address }}</textarea><div class="form-row"><div><label>Tax rate (%)</label><input name="tax_rate" type="number" min="0" max="100" step=".01" value="{{ settings.tax_rate }}"></div><div><label>Logo URL (optional)</label><input name="logo_url" value="{{ settings.logo_url or '' }}" placeholder="https://..."></div></div><button class="btn primary">Save settings →</button></form>{% endblock %}
